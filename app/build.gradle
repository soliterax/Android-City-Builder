plugins {
    id 'com.android.application'
}

android {
    namespace 'com.soliterax.kentustasi'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.soliterax.kentustasi'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // Depoya dahil edilen ortak imza: her derleme aynı imzayı taşır,
        // böylece yeni sürüm eskisinin üzerine kurulur ve kayıt silinmez.
        // Play Store'a yüklemek için kendi anahtarınla değiştir.
        shared {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
