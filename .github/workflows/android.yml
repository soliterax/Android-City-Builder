name: Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Oyun mantığı testi
        run: node tools/smoke.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: ./gradlew assembleRelease --no-daemon

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/release/app-release.apk KentUstasi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KentUstasi-apk
          path: KentUstasi.apk
